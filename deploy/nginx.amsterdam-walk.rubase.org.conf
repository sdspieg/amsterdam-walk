# nginx vhost for amsterdam-walk.rubase.org
# Static site served from /stratbase/apps/webapps/amsterdam-walk.
# Run certbot --nginx -d amsterdam-walk.rubase.org after first deploy.

server {
    listen 80;
    listen [::]:80;
    server_name amsterdam-walk.rubase.org;

    root /stratbase/apps/webapps/amsterdam-walk;
    index index.html;

    # Cache assets aggressively, HTML lightly
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    location ~* \.html?$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    location = /data/stops.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
